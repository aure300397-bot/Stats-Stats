function run() {
  const btn = document.getElementById('btn');
  const log = document.getElementById('log');
  btn.disabled = true;
  log.style.display = 'block';
  log.className = '';

  try {
    const raw = localStorage.getItem(DB_KEY);
    const db = raw ? JSON.parse(raw) : {body:{heightCm:null,entries:[]},templates:[],sessions:[],exerciseLib:[],seeded:false};
    if (!Array.isArray(db.sessions)) db.sessions = [];
    if (!Array.isArray(db.exerciseLib)) db.exerciseLib = [];

    const added = [], skipped = [];

    for (const s of SESSIONS) {
      const exists = db.sessions.some(x => x.id === s.id || (x.date === s.date && x.name === s.name));
      if (exists) { skipped.push(s); continue; }
      db.sessions.push(s);
      added.push(s);
      for (const e of s.entries) {
        if (!db.exerciseLib.includes(e.name)) db.exerciseLib.push(e.name);
      }
    }

    /* Tri chronologique */
    db.sessions.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);

    localStorage.setItem(DB_KEY, JSON.stringify(db));

    const fmt = s => `${s.date.slice(8)}/${s.date.slice(5,7)} — ${s.name}`;
    log.innerHTML =
      `<h2>✅ ${added.length} séance(s) importée(s)</h2>` +
      `<ul>${added.map(s => `<li>${fmt(s)}</li>`).join('')}</ul>` +
      (skipped.length
        ? `<h2>⚠ ${skipped.length} déjà présente(s), ignorée(s)</h2><ul>${skipped.map(s=>`<li>${fmt(s)}</li>`).join('')}</ul>`
        : '') +
      `<p><strong>Ouvrez (ou rechargez) l'app Stats Stats pour voir vos séances.</strong></p>`;
  } catch (e) {
    log.className = 'error';
    log.innerHTML = `<h2>❌ Erreur</h2><p>${e.message}</p>`;
    btn.disabled = false;
  }
}
