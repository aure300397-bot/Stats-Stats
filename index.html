<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stats, Stats">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Stats, Stats — Suivi musculation</title>
<style>
  :root{
    --bg:#0E1014; --surface:#181B22; --surface-2:#1F2430; --border:#2A303C;
    --text:#ECEEF2; --muted:#8A93A3; --faint:#5A6373;
    --accent:#FF5C39; --accent-dim:#3a2018;
    --up:#3DD68C; --down:#FF5C5C;
    --r:14px; --r-sm:10px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);
    overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
  body{padding-bottom:calc(78px + var(--safe-b))}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit}
  ::-webkit-scrollbar{width:0;height:0}

  /* Header */
  header{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--bg) 70%,rgba(14,16,20,0));
    padding:calc(14px + var(--safe-t)) 18px 12px;display:flex;align-items:baseline;justify-content:space-between}
  .brand{font-weight:800;font-size:20px;letter-spacing:-.5px;display:flex;align-items:center;gap:9px}
  .brand .mark{width:11px;height:22px;background:var(--accent);border-radius:3px;
    box-shadow:0 0 14px var(--accent);transform:skewX(-8deg)}
  .brand small{font-family:var(--mono);font-size:10px;color:var(--faint);font-weight:500;
    letter-spacing:1.5px;text-transform:uppercase;align-self:flex-end}
  .h-date{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;line-height:1.4}

  main{padding:4px 16px 24px;max-width:560px;margin:0 auto}
  .view{display:none;animation:fade .25s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* Generic */
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;
    color:var(--faint);margin:24px 2px 10px}
  .eyebrow:first-child{margin-top:6px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:12px}
  .between{justify-content:space-between}
  .pill{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:999px;
    background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
  .pill.accent{background:var(--accent-dim);color:var(--accent);border-color:transparent}
  .muted{color:var(--muted)}.faint{color:var(--faint)}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .up{color:var(--up)}.down{color:var(--down)}

  .btn{background:var(--accent);color:#fff;font-weight:700;padding:14px 18px;border-radius:var(--r-sm);
    font-size:15px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 6px 18px -8px var(--accent);transition:transform .08s}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);box-shadow:none;font-weight:600}
  .btn.sm{padding:10px 14px;font-size:13px;width:auto}
  .btn.danger{background:transparent;color:var(--down);border:1px solid var(--border);box-shadow:none}

  input,select{background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:var(--r-sm);padding:12px 13px;font-size:16px;width:100%;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  input.mini{padding:11px 8px;text-align:center;font-family:var(--mono);font-weight:600;font-size:17px}
  label.fld{display:block;margin-bottom:12px}
  label.fld span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.3px}

  .empty{text-align:center;padding:42px 20px;color:var(--muted)}
  .empty .big{font-size:40px;margin-bottom:10px;opacity:.8}
  .empty h3{margin:0 0 6px;color:var(--text);font-weight:700}
  .empty p{margin:0 0 18px;font-size:14px;line-height:1.5}

  /* exercise log block */
  .exblock{border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden;background:var(--surface)}
  .exhead{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;background:var(--surface-2)}
  .exhead .name{font-weight:700;font-size:15px}
  .exhead .sub{font-size:11px;color:var(--faint);font-family:var(--mono);margin-top:2px}
  .sets{padding:6px 10px 10px}
  .setrow{display:grid;grid-template-columns:34px 1fr 1fr 30px;gap:8px;align-items:center;padding:5px 4px}
  .setrow .idx{font-family:var(--mono);font-size:13px;color:var(--faint);text-align:center}
  .setrow .x{font-size:18px;color:var(--faint);text-align:center;line-height:1}
  .setlabels{display:grid;grid-template-columns:34px 1fr 1fr 30px;gap:8px;padding:2px 4px 0}
  .setlabels span{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.8px;text-align:center}
  .setlabels span:first-child{text-align:left}
  .addset{width:100%;text-align:center;padding:9px;color:var(--accent);font-weight:600;font-size:13px;
    font-family:var(--mono);border-top:1px dashed var(--border)}
  .prflag{font-family:var(--mono);font-size:9.5px;font-weight:700;color:#fff;background:var(--up);
    padding:2px 6px;border-radius:5px;letter-spacing:.5px}

  /* lists */
  .litem{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px}
  .litem:active{border-color:var(--accent)}
  .litem .t{font-weight:650;font-size:15px}
  .litem .s{font-size:12px;color:var(--muted);margin-top:3px;font-family:var(--mono)}
  .chev{color:var(--faint);font-size:20px}

  /* stat tiles */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px}
  .tile .k{font-size:11px;color:var(--muted);letter-spacing:.5px}
  .tile .v{font-family:var(--mono);font-size:26px;font-weight:700;margin-top:5px;letter-spacing:-1px}
  .tile .u{font-size:13px;color:var(--faint);font-weight:500}
  .tile .d{font-size:12px;font-family:var(--mono);margin-top:3px}

  /* chart */
  .chart{width:100%;height:170px;display:block}
  .chart .grid{stroke:var(--border);stroke-width:1}
  .chart .line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
  .chart .area{fill:url(#g);opacity:.5}
  .chart .dot{fill:var(--accent)}
  .chart .lbl{fill:var(--faint);font-family:var(--mono);font-size:9px}
  .seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);
    padding:3px;gap:3px;margin-bottom:14px;overflow-x:auto}
  .seg button{flex:1;white-space:nowrap;padding:8px 10px;border-radius:7px;font-size:12.5px;color:var(--muted);font-weight:600}
  .seg button.on{background:var(--accent);color:#fff}

  /* tabbar */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;
    background:rgba(20,23,28,.92);backdrop-filter:blur(16px);border-top:1px solid var(--border);
    padding:8px 6px calc(8px + var(--safe-b))}
  nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 0;color:var(--faint)}
  nav.tabs button.on{color:var(--accent)}
  nav.tabs .ic{width:24px;height:24px}
  nav.tabs .lab{font-size:10px;font-weight:600;letter-spacing:.2px}

  /* sheet / modal */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);
    border-radius:20px 20px 0 0;border-top:1px solid var(--border);padding:8px 18px calc(24px + var(--safe-b));
    transform:translateY(102%);transition:transform .26s cubic-bezier(.3,.8,.3,1);max-height:88vh;overflow-y:auto;max-width:560px;margin:0 auto}
  .sheet.show{transform:none}
  .grab{width:38px;height:4px;background:var(--border);border-radius:3px;margin:8px auto 14px}
  .sheet h2{margin:0 0 4px;font-size:19px;font-weight:800;letter-spacing:-.3px}
  .sheet .desc{color:var(--muted);font-size:13px;margin:0 0 18px;line-height:1.5}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
  .chip{padding:9px 13px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);
    font-size:13px;font-weight:600}
  .chip.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
  .chip.add{color:var(--accent);border-style:dashed}

  .toast{position:fixed;bottom:calc(92px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(10px);
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:999px;
    font-size:13px;font-weight:600;z-index:80;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;
    box-shadow:0 10px 30px -10px #000}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .toast.pr{border-color:var(--up);color:var(--up)}

  .delx{color:var(--faint);font-size:20px;padding:4px 8px}
  .seshead{display:flex;align-items:center;justify-content:space-between;margin:2px 0 16px}
  .seshead .ttl{font-size:24px;font-weight:800;letter-spacing:-.6px}
  .seshead .dt{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px}
  .small{font-size:12px}
  hr.sep{border:none;border-top:1px solid var(--border);margin:18px 0}
  a.link{color:var(--accent);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark"></span>Stats, Stats</div>
  <div class="h-date" id="hdate"></div>
</header>

<main>
  <!-- ============ SÉANCE ============ -->
  <section class="view active" id="v-seance"></section>
  <!-- ============ PROGRAMME ============ -->
  <section class="view" id="v-prog"></section>
  <!-- ============ STATS ============ -->
  <section class="view" id="v-stats"></section>
  <!-- ============ CORPS ============ -->
  <section class="view" id="v-corps"></section>
</main>

<nav class="tabs" id="tabs"></nav>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   STATS, STATS — suivi musculation (stockage 100% local)
   ============================================================ */
const DB_KEY='statsstats.db.v1';
const todayISO=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2,9);
const fmtDate=iso=>{const[y,m,d]=iso.split('-');return d+'/'+m+'/'+y;};
const fmtShort=iso=>{const[,m,d]=iso.split('-');return d+'/'+m;};

const DEFAULT_DB={
  body:{heightCm:null,entries:[]},
  templates:[],
  sessions:[],
  exerciseLib:[],  // noms d'exercices déjà utilisés
  seeded:false
};

/* Programme Upper/Lower pré-enregistré (abdos -> face pull pour la posture) */
const SEED_TEMPLATES=[
  {id:'tpl-ua',name:'Upper A — Push lourd',exercises:[
    {name:'Développé couché barre',targetSets:4,targetReps:'4–6',rest:'3 min'},
    {name:'Rowing barre buste penché',targetSets:4,targetReps:'6–8',rest:'2–3 min'},
    {name:'Développé militaire haltères',targetSets:4,targetReps:'6–8',rest:'2–3 min'},
    {name:'Tirage vertical poulie',targetSets:3,targetReps:'8–12',rest:'2 min'},
    {name:'Élévations latérales',targetSets:3,targetReps:'12–15',rest:'90 s'},
    {name:'Curl haltères banc incliné',targetSets:3,targetReps:'10–12',rest:'90 s'},
    {name:'Triceps poulie haute (corde)',targetSets:3,targetReps:'10–12',rest:'90 s'},
  ]},
  {id:'tpl-la',name:'Lower A — Squat',exercises:[
    {name:'Squat barre',targetSets:4,targetReps:'4–6',rest:'3 min'},
    {name:'RDL (soulevé roumain)',targetSets:3,targetReps:'8–10',rest:'2–3 min'},
    {name:'Presse à cuisses',targetSets:3,targetReps:'10–12',rest:'2 min'},
    {name:'Leg curl machine (ischios)',targetSets:3,targetReps:'10–12',rest:'90 s'},
    {name:'Mollets assis',targetSets:4,targetReps:'12–15',rest:'60 s'},
    {name:'Gainage planche',targetSets:3,targetReps:'45 s',rest:'60 s'},
  ]},
  {id:'tpl-ub',name:'Upper B — Pull lourd',exercises:[
    {name:'Tractions ou tirage vertical lesté',targetSets:4,targetReps:'6–8',rest:'3 min'},
    {name:'Développé incliné barre',targetSets:4,targetReps:'8–10',rest:'2–3 min'},
    {name:'Tirage horizontal serré',targetSets:3,targetReps:'10–12',rest:'2 min'},
    {name:'Pec fly machine ou écarté poulie',targetSets:3,targetReps:'12–15',rest:'90 s'},
    {name:'Dips lestés',targetSets:3,targetReps:'8–10',rest:'2 min'},
    {name:'Curl barre EZ debout',targetSets:3,targetReps:'8–10',rest:'90 s'},
    {name:'Curl marteau haltères',targetSets:2,targetReps:'12–15',rest:'60 s'},
  ]},
  {id:'tpl-lb',name:'Lower B — Hip hinge',exercises:[
    {name:'Soulevé de terre conventionnel',targetSets:4,targetReps:'3–5',rest:'3 min'},
    {name:'Hack squat ou fentes haltères',targetSets:3,targetReps:'8–10',rest:'2–3 min'},
    {name:'Hip thrust barre',targetSets:3,targetReps:'10–12',rest:'2 min'},
    {name:'Leg extension (quads)',targetSets:3,targetReps:'12–15',rest:'90 s'},
    {name:'Mollets debout',targetSets:4,targetReps:'10–12',rest:'60 s'},
    {name:'Face pull',targetSets:3,targetReps:'15–20',rest:'90 s'},
  ]},
];
function seedProgram(){
  if(db.seeded)return;
  if(db.templates.length||db.sessions.length){db.seeded=true;save();return;}
  db.templates=structuredClone(SEED_TEMPLATES);
  SEED_TEMPLATES.forEach(t=>t.exercises.forEach(x=>{if(!db.exerciseLib.includes(x.name))db.exerciseLib.push(x.name);}));
  db.seeded=true;save();
}
let db=load();
seedProgram();
let state={tab:'seance',session:null,statsEx:null,statsMetric:'1rm',corpsMetric:'weight'};

function load(){
  try{const raw=localStorage.getItem(DB_KEY);if(!raw)return structuredClone(DEFAULT_DB);
    const d=JSON.parse(raw);return Object.assign(structuredClone(DEFAULT_DB),d);}
  catch(e){return structuredClone(DEFAULT_DB);}
}
function save(){localStorage.setItem(DB_KEY,JSON.stringify(db));}

/* ---------- helpers domaine ---------- */
function epley(w,r){return r>0&&w>0?Math.round(w*(1+r/30)):0;}
function bestSet(sets){let b=null;for(const s of sets){if(!s.weight||!s.reps)continue;
  const e=epley(s.weight,s.reps);if(!b||e>b.e)b={...s,e};}return b;}
function exMaxWeight(sets){let m=0;for(const s of sets){if(s.weight>m&&s.reps>0)m=s.weight;}return m;}
function exVolume(sets){return sets.reduce((a,s)=>a+((s.weight||0)*(s.reps||0)),0);}

/* historique d'un exercice (par nom) trié par date asc */
function exerciseHistory(name){
  const out=[];
  for(const s of db.sessions){
    for(const e of s.entries){
      if(e.name===name){
        const valid=e.sets.filter(x=>x.weight>0&&x.reps>0);
        if(valid.length) out.push({date:s.date,sets:valid});
      }
    }
  }
  return out.sort((a,b)=>a.date<b.date?-1:1);
}
function allExerciseNames(){
  const set=new Set(db.exerciseLib);
  db.sessions.forEach(s=>s.entries.forEach(e=>set.add(e.name)));
  db.templates.forEach(t=>t.exercises.forEach(x=>set.add(x.name)));
  return [...set].sort((a,b)=>a.localeCompare(b,'fr'));
}
/* meilleur 1RM estimé AVANT une date donnée, pour détecter un PR */
function prBefore(name,beforeISO){
  let best=0;
  for(const h of exerciseHistory(name)){
    if(h.date>=beforeISO)continue;
    for(const s of h.sets)best=Math.max(best,epley(s.weight,s.reps));
  }
  return best;
}

/* ============================================================
   RENDER ROUTER
   ============================================================ */
function render(){
  document.getElementById('hdate').innerHTML=
    new Date().toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'short'}).replace('.','');
  renderTabs();
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const map={seance:'v-seance',prog:'v-prog',stats:'v-stats',corps:'v-corps'};
  document.getElementById(map[state.tab]).classList.add('active');
  if(state.tab==='seance')renderSeance();
  if(state.tab==='prog')renderProg();
  if(state.tab==='stats')renderStats();
  if(state.tab==='corps')renderCorps();
}

const ICONS={
  seance:'<path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>',
  prog:'<path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  stats:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>',
  corps:'<path d="M12 7a2.4 2.4 0 100-4.8A2.4 2.4 0 0012 7zM12 7v7m0 0l-3 6m3-6l3 6M7 10l5-1 5 1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>'
};
function renderTabs(){
  const labels={seance:'Séance',prog:'Programme',stats:'Stats',corps:'Corps'};
  document.getElementById('tabs').innerHTML=Object.keys(labels).map(k=>
    `<button class="${state.tab===k?'on':''}" onclick="go('${k}')">
       <svg class="ic" viewBox="0 0 24 24">${ICONS[k]}</svg>
       <span class="lab">${labels[k]}</span></button>`).join('');
}
function go(tab){state.tab=tab;if(tab!=='seance')state.session=state.session;render();window.scrollTo(0,0);}

/* ============================================================
   VUE SÉANCE
   ============================================================ */
function renderSeance(){
  const el=document.getElementById('v-seance');
  if(state.session){el.innerHTML=seanceLogHTML(state.session);return;}
  // pas de séance en cours -> proposer de démarrer
  const recent=db.sessions.slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,8);
  let html=`<div class="seshead"><div>
      <div class="ttl">Entraînement</div>
      <div class="dt">${recent.length} séance${recent.length>1?'s':''} enregistrée${recent.length>1?'s':''}</div>
    </div></div>`;

  if(db.templates.length){
    html+=`<div class="eyebrow">Démarrer une séance</div>`;
    html+=db.templates.map(t=>`
      <button class="litem" style="width:100%;text-align:left" onclick="startSession('${t.id}')">
        <div><div class="t">${esc(t.name)}</div>
          <div class="s">${t.exercises.length} exercice${t.exercises.length>1?'s':''}</div></div>
        <span class="chev">›</span>
      </button>`).join('');
    html+=`<button class="btn ghost sm" style="width:100%;margin-top:4px" onclick="startSession(null)">+ Séance libre (sans modèle)</button>`;
  }else{
    html+=`<div class="card empty">
      <div class="big">🏋️</div>
      <h3>Aucun modèle de séance</h3>
      <p>Crée d'abord tes séances types (Push, Pull, Jambes…) dans l'onglet Programme. Tu pourras ensuite les lancer en un tap.</p>
      <button class="btn" onclick="go('prog')">Aller au programme</button>
    </div>
    <button class="btn ghost" onclick="startSession(null)">Ou démarrer une séance libre</button>`;
  }

  if(recent.length){
    html+=`<div class="eyebrow">Historique récent</div>`;
    html+=recent.map(s=>{
      const sets=s.entries.reduce((a,e)=>a+e.sets.filter(x=>x.reps>0).length,0);
      const vol=s.entries.reduce((a,e)=>a+exVolume(e.sets),0);
      return `<button class="litem" style="width:100%;text-align:left" onclick="openSession('${s.id}')">
        <div><div class="t">${esc(s.name||'Séance')}</div>
          <div class="s">${fmtDate(s.date)} · ${s.entries.length} ex · ${sets} séries · ${Math.round(vol)} kg vol.</div></div>
        <span class="chev">›</span></button>`;
    }).join('');
  }
  el.innerHTML=html;
}

function startSession(templateId){
  const t=templateId?db.templates.find(x=>x.id===templateId):null;
  state.session={
    id:uid(),date:todayISO(),templateId:templateId||null,
    name:t?t.name:'Séance libre',saved:false,
    entries:(t?t.exercises:[]).map(x=>({name:x.name,
      target:x.targetSets?{sets:x.targetSets,reps:x.targetReps,rest:x.rest}:null,
      sets:[{weight:lastWeight(x.name),reps:null}]}))
  };
  render();window.scrollTo(0,0);
}
function lastWeight(name){const h=exerciseHistory(name);if(!h.length)return null;
  const last=h[h.length-1];return exMaxWeight(last.sets)||null;}

function openSession(id){const s=db.sessions.find(x=>x.id===id);if(!s)return;
  state.session=structuredClone(s);state.session.saved=true;render();window.scrollTo(0,0);}

function seanceLogHTML(s){
  let html=`<div class="seshead">
    <div><div class="ttl">${esc(s.name)}</div><div class="dt">${fmtDate(s.date)}</div></div>
    <button class="delx" onclick="closeSessionView()">✕</button></div>`;

  html+=s.entries.map((e,ei)=>{
    const setsHtml=e.sets.map((st,si)=>`
      <div class="setrow">
        <div class="idx">${si+1}</div>
        <input class="mini" type="number" inputmode="decimal" placeholder="—" value="${st.weight??''}"
               oninput="setField(${ei},${si},'weight',this.value)">
        <input class="mini" type="number" inputmode="numeric" placeholder="—" value="${st.reps??''}"
               oninput="setField(${ei},${si},'reps',this.value)">
        <button class="x" onclick="rmSet(${ei},${si})">×</button>
      </div>`).join('');
    const best=bestSet(e.sets.filter(x=>x.weight>0&&x.reps>0));
    const tgt=e.target;
    const sub=best?`top ${best.weight}kg × ${best.reps} · 1RM≈${best.e}kg`
      :(tgt?`cible ${tgt.sets}×${tgt.reps}${tgt.rest?` · repos ${tgt.rest}`:''}`:'à remplir');
    const pr=best?prBefore(e.name,s.date):0;
    const isPR=best&&best.e>pr&&pr>0;
    return `<div class="exblock">
      <div class="exhead">
        <div><div class="name">${esc(e.name)}</div>
          <div class="sub">${sub}</div></div>
        <div class="row" style="gap:8px">
          ${isPR?'<span class="prflag">RECORD</span>':''}
          <button class="delx" onclick="rmExercise(${ei})">⋯</button></div>
      </div>
      <div class="setlabels"><span>Série</span><span>Poids (kg)</span><span>Reps</span><span></span></div>
      <div class="sets">${setsHtml}
        <button class="addset" onclick="addSet(${ei})">+ Ajouter une série</button></div>
    </div>`;
  }).join('');

  html+=`<button class="btn ghost" style="margin-top:4px" onclick="openAddExercise()">+ Ajouter un exercice</button>`;
  html+=`<button class="btn" style="margin-top:12px" onclick="saveSession()">${s.saved?'Mettre à jour la séance':'Terminer & enregistrer'}</button>`;
  if(s.saved)html+=`<button class="btn danger" style="margin-top:10px" onclick="deleteSession('${s.id}')">Supprimer cette séance</button>`;
  return html;
}

function setField(ei,si,f,v){const n=v===''?null:parseFloat(v.replace(',','.'));
  state.session.entries[ei].sets[si][f]=isNaN(n)?null:n;}
function addSet(ei){const sets=state.session.entries[ei].sets;const last=sets[sets.length-1]||{};
  sets.push({weight:last.weight??null,reps:last.reps??null});reRenderSession();}
function rmSet(ei,si){const sets=state.session.entries[ei].sets;
  if(sets.length>1)sets.splice(si,1);else sets[0]={weight:null,reps:null};reRenderSession();}
function rmExercise(ei){if(confirm('Retirer cet exercice de la séance ?')){
  state.session.entries.splice(ei,1);reRenderSession();}}
function reRenderSession(){document.getElementById('v-seance').innerHTML=seanceLogHTML(state.session);}
function closeSessionView(){
  if(!state.session.saved && hasData(state.session)){
    if(!confirm('Quitter sans enregistrer ? Les données saisies seront perdues.'))return;
  }
  state.session=null;render();
}
function hasData(s){return s.entries.some(e=>e.sets.some(x=>x.weight>0||x.reps>0));}

function saveSession(){
  const s=state.session;
  s.entries=s.entries.filter(e=>e.sets.some(x=>x.weight>0||x.reps>0));
  s.entries.forEach(e=>{e.sets=e.sets.filter(x=>x.weight>0||x.reps>0);});
  if(!s.entries.length){toast('Rien à enregistrer');return;}
  s.entries.forEach(e=>{if(!db.exerciseLib.includes(e.name))db.exerciseLib.push(e.name);});
  // détection PR globale pour le toast
  let prHit=false;
  s.entries.forEach(e=>{const b=bestSet(e.sets);const before=prBefore(e.name,s.date);
    if(b&&before>0&&b.e>before)prHit=true;});
  const idx=db.sessions.findIndex(x=>x.id===s.id);
  if(idx>=0)db.sessions[idx]=structuredClone(s);else db.sessions.push(structuredClone(s));
  save();state.session=null;render();
  toast(prHit?'💪 Nouveau record !':'Séance enregistrée',prHit);
}
function deleteSession(id){if(!confirm('Supprimer définitivement cette séance ?'))return;
  db.sessions=db.sessions.filter(x=>x.id!==id);save();state.session=null;render();toast('Séance supprimée');}

/* ============================================================

   ============================================================ */
function renderStats(){
  const el=document.getElementById('v-stats');
  const names=allExerciseNames().filter(n=>exerciseHistory(n).length);
  let html=`<div class="seshead"><div><div class="ttl">Progression</div>
    <div class="dt">${db.sessions.length} séance${db.sessions.length>1?'s':''}</div></div></div>`;

  if(!names.length){
    html+=`<div class="card empty"><div class="big">📈</div><h3>Pas encore de données</h3>
      <p>Enregistre quelques séances et tes courbes de progression apparaîtront ici, exercice par exercice.</p></div>`;
    el.innerHTML=html;return;
  }
  if(!state.statsEx||!names.includes(state.statsEx))state.statsEx=names[0];

  // résumé global
  const totalVol=db.sessions.reduce((a,s)=>a+s.entries.reduce((b,e)=>b+exVolume(e.sets),0),0);
  const totalSets=db.sessions.reduce((a,s)=>a+s.entries.reduce((b,e)=>b+e.sets.filter(x=>x.reps>0).length,0),0);
  html+=`<div class="tiles" style="margin-bottom:18px">
    <div class="tile"><div class="k">Volume total</div><div class="v">${(totalVol/1000).toFixed(1)}<span class="u"> t</span></div></div>
    <div class="tile"><div class="k">Séries totales</div><div class="v">${totalSets}</div></div></div>`;

  html+=`<div class="eyebrow">Exercice</div>
    <select onchange="state.statsEx=this.value;renderStats()">
      ${names.map(n=>`<option ${n===state.statsEx?'selected':''}>${esc(n)}</option>`).join('')}
    </select>`;

  const metrics=[['1rm','1RM estimé'],['weight','Charge max'],['volume','Volume']];
  html+=`<div class="seg" style="margin-top:14px">${metrics.map(m=>
    `<button class="${state.statsMetric===m[0]?'on':''}" onclick="state.statsMetric='${m[0]}';renderStats()">${m[1]}</button>`).join('')}</div>`;

  const hist=exerciseHistory(state.statsEx);
  const series=hist.map(h=>{
    let v;
    if(state.statsMetric==='1rm')v=Math.max(...h.sets.map(s=>epley(s.weight,s.reps)));
    else if(state.statsMetric==='weight')v=exMaxWeight(h.sets);
    else v=exVolume(h.sets);
    return {date:h.date,v};
  });
  const cur=series[series.length-1].v, first=series[0].v;
  const delta=cur-first, pct=first?Math.round(delta/first*100):0;
  const unit=state.statsMetric==='volume'?'kg':'kg';
  html+=`<div class="card" style="margin-top:6px">
    <div class="row between">
      <div><div class="muted small">Actuel</div>
        <div class="num" style="font-size:30px;font-weight:800;letter-spacing:-1px">${cur}<span class="u faint" style="font-size:14px"> ${unit}</span></div></div>
      <div style="text-align:right">
        <div class="muted small">Depuis le départ</div>
        <div class="num ${delta>=0?'up':'down'}" style="font-size:16px;font-weight:700">${delta>=0?'+':''}${delta} ${unit} ${first?`(${pct>=0?'+':''}${pct}%)`:''}</div></div>
    </div>
    ${chartSVG(series)}
  </div>`;

  // dernières perfs
  html+=`<div class="eyebrow">Dernières séances</div>`;
  html+=hist.slice(-6).reverse().map(h=>{
    const b=bestSet(h.sets);
    return `<div class="litem"><div><div class="t num">${b.weight} kg × ${b.reps}</div>
      <div class="s">${fmtDate(h.date)} · ${h.sets.length} série${h.sets.length>1?'s':''} · 1RM≈${b.e}kg</div></div></div>`;
  }).join('');
  el.innerHTML=html;
}

/* ============================================================
   CHART SVG (autonome, hors-ligne)
   ============================================================ */
function chartSVG(series){
  if(series.length<2)return`<p class="faint small" style="text-align:center;margin:30px 0">Au moins 2 points nécessaires pour la courbe.</p>`;
  const W=320,H=170,padL=8,padR=8,padT=14,padB=22;
  const xs=(i)=>padL+(i/(series.length-1))*(W-padL-padR);
  const vals=series.map(s=>s.v);
  let mn=Math.min(...vals),mx=Math.max(...vals);
  if(mn===mx){mn-=1;mx+=1;}const span=mx-mn;
  const ys=(v)=>padT+(1-(v-mn)/span)*(H-padT-padB);
  let pts=series.map((s,i)=>`${xs(i).toFixed(1)},${ys(s.v).toFixed(1)}`);
  const line=`M${pts.join(' L')}`;
  const area=`M${xs(0).toFixed(1)},${(H-padB).toFixed(1)} L${pts.join(' L')} L${xs(series.length-1).toFixed(1)},${(H-padB).toFixed(1)} Z`;
  // 3 gridlines
  let grid='';for(let g=0;g<3;g++){const y=padT+g*((H-padT-padB)/2);
    grid+=`<line class="grid" x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}"/>`;}
  // x labels (premier, milieu, dernier)
  const labIdx=[0,Math.floor((series.length-1)/2),series.length-1];
  let xlab='';labIdx.forEach(i=>{const anchor=i===0?'start':i===series.length-1?'end':'middle';
    xlab+=`<text class="lbl" x="${xs(i).toFixed(1)}" y="${H-6}" text-anchor="${anchor}">${fmtShort(series[i].date)}</text>`;});
  const dots=series.map((s,i)=>`<circle class="dot" cx="${xs(i).toFixed(1)}" cy="${ys(s.v).toFixed(1)}" r="${i===series.length-1?4:2.5}"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/>
      <stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path class="area" d="${area}"/><path class="line" d="${line}"/>${dots}${xlab}
    <text class="lbl" x="${padL}" y="${padT-3}">${mx}</text>
    <text class="lbl" x="${padL}" y="${H-padB}">${mn}</text>
  </svg>`;
}

/* ============================================================
   SHEET / TOAST / UTIL
   ============================================================ */
function openSheet(html){const s=document.getElementById('sheet');
  s.innerHTML=`<div class="grab"></div>`+html;
  document.getElementById('scrim').classList.add('show');
  requestAnimationFrame(()=>s.classList.add('show'));}
function closeSheet(){document.getElementById('sheet').classList.remove('show');
  document.getElementById('scrim').classList.remove('show');}
let toastT;
function toast(msg,isPR){const t=document.getElementById('toast');t.textContent=msg;
  t.className='toast show'+(isPR?' pr':'');clearTimeout(toastT);
  toastT=setTimeout(()=>t.className='toast',2200);}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function escAttr(s){return String(s??'').replace(/'/g,"\\'").replace(/"/g,'&quot;');}

/* export / import */
function exportData(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='stats-stats-sauvegarde-'+todayISO()+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Sauvegarde exportée');
}
function importData(input){const f=input.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
    if(!d.sessions&&!d.templates&&!d.body)throw 0;
    if(!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?'))return;
    db=Object.assign(structuredClone(DEFAULT_DB),d);save();state.session=null;render();toast('Sauvegarde importée');
  }catch(e){toast('Fichier invalide');}};r.readAsText(f);input.value='';}

render();

/* PWA : enregistrement du service worker (mode app + hors-ligne) */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
